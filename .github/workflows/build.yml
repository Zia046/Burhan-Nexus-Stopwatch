name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe (win-x64)
        run: >
          dotnet publish src/BurhanNexusStopwatch/BurhanNexusStopwatch.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md publish/win-x64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath BurhanNexusStopwatch-win-x64.zip -Force
          Get-ChildItem publish/win-x64 | Format-Table Name, Length

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/BurhanNexusStopwatch/BurhanNexusStopwatch.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$v" "/DPublishDir=..\publish\win-x64" installer\BurhanNexusStopwatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BurhanNexusStopwatch-win-x64
          path: publish/win-x64/

      - uses: actions/upload-artifact@v4
        with:
          name: BurhanNexusStopwatch-Setup
          path: installer-output/*.exe

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/BurhanNexusStopwatch/BurhanNexusStopwatch.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      # Pushes to main publish/update the release for the version in the .csproj.
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Burhan Nexus Stopwatch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: |
            installer-output/*.exe
            BurhanNexusStopwatch-win-x64.zip
          body: |
            **Burhan Nexus Stopwatch** for Windows 10 / 11 (64-bit). No .NET installation needed.

            **Recommended:** download `BurhanNexusStopwatch-Setup-x.y.z.exe` and run it.
            It installs the app, adds a Desktop and Start Menu shortcut, and registers an uninstaller
            (Settings > Apps).

            **Portable:** download `BurhanNexusStopwatch-win-x64.zip`, extract it, and run `BurhanNexusStopwatch.exe`.
